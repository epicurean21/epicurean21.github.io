focus:
  - kicker: agentic pipelines
    title: 멀티턴 캠페인·소재 에이전트
    text: 소재 에이전트의 A2A 서버와 생성 워커를 직접 만들어 담당하고 있습니다. 후속 요청에서 이전 이미지를 이어서 활용할 수 있고, 결과물별 완료·실패 상태를 추적합니다. 팀이 함께 만든 LangGraph 캠페인 에이전트에서는 검색(RAG) 서비스와 검색 도구를 구축하고 미리보기와 타겟팅 규칙을 개선했습니다.
  - kicker: generative creative
    title: 생성형 AI 광고 소재
    text: LINE Ads와 LY Corporation의 여러 광고 상품에 광고 문구·이미지 생성 기능을 연동합니다. 아웃페인팅 기반의 이미지 생성 서비스를 처음부터 구축했고, 랜딩페이지 브랜드 정보 추출을 재구축했으며, 인페인팅·크롤링 이미지 처리·크레딧 제어를 추가했습니다.
  - kicker: ad-tech core
    title: 광고 도메인과 성과 리포트
    text: LINE Ads Manager에서 A/B 테스트 캠페인을 공동 개발하고 자동 타겟팅·캠페인 예산 최적화(CBO)·입찰·예산 검증을 구축했습니다. 리포트 영역에서는 Kafka 기반 리포트 내보내기를 만들고, 광고비 대비 매출(ROAS)·구매 금액 지표를 도입했으며, Kylin 조회를 새 클러스터로 이전했습니다.
  - kicker: evaluation & reliability
    title: 품질 평가와 운영 안정성
    text: 생성된 광고 문구는 규칙 기반 테스트로 통과 여부를 판단하고, LLM-as-a-Judge 점수는 검토용으로 기록합니다. 이 회귀 테스트는 지정한 검증 환경의 배포 후 자동으로 실행됩니다. 비동기 생성에서는 재전달·중복·부분 실패를 전제로 설계하고, 요청·결과물 식별자로 처리 과정을 추적합니다.


  summary: |
    **2022년부터 LINE 광고 플랫폼(DSP)**의 캠페인·광고그룹·광고 관리와 성과 리포트를 개발해 온 백엔드 엔지니어입니다. 광고 도메인 경험을 바탕으로 **생성형 AI 광고 소재 서비스와 멀티턴 에이전트**로 개발 영역을 넓혔습니다.

    현재는 소재 에이전트의 A2A 서버와 비동기 생성 워커를 주로 담당합니다. 캠페인 설정 검증, 생성 결과의 상태 관리, 크레딧 제어, 품질 평가를 통해 AI 기능을 광고 서비스에 연결합니다.

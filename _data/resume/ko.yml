projects:
  - title: 멀티턴 광고 소재 에이전트 — A2A 서버·워커
    kicker: a2a · event-driven · genai
    period: 2026.03 — 현재
    ongoing: true
    summary: LangGraph 대화 클라이언트의 요청을 A2A로 받아, Kafka 기반 비동기 워커로 광고 문구와 이미지를 생성하는 에이전트 플랫폼입니다. A2A 서버와 생성 워커를 구축하고, 작업 관리·결과 저장·자동화 테스트를 구현했습니다.
    flow: [A2A 요청, Kafka 요청 토픽, 생성 워커, Kafka 결과 토픽, 결과 저장, SSE·상태 조회]
    highlights:
      - Java 21, Spring Boot 3 기반으로 **A2A(Agent-to-Agent) 서버**를 구축했습니다. JSON-RPC, SSE 스트리밍, Agent Card, PostgreSQL 작업·결과물 저장을 구현하고, 요청당 최대 4개의 결과물과 이전 이미지를 이어서 활용하는 후속 요청을 지원했습니다.
      - 오래 걸리는 생성 작업을 동기 호출에서 **Kafka 기반 비동기 워커**로 옮겼습니다. 새 경로를 섀도 모드로 먼저 운영한 뒤 전환했고, 발행 전에 요청한 결과물의 레코드를 만들고 완료·실패 상태를 개별 관리해, 일부가 실패해도 성공한 결과물을 유지하도록 했습니다.
      - "**at-least-once 전달**을 전제로 설계했습니다. 재시도 한도와 데드 레터 큐(DLQ)를 두고, **taskId 메시지 키**로 같은 작업의 이벤트를 각 토픽의 동일 파티션에 배치했습니다. 순서 보장의 범위는 파티션 내부이며, 재시도·중복 전달에는 (taskId, artifactId) 유일 키와 조건부 상태 갱신으로 대응합니다. 모델 오류는 실패 결과로 기록하고 자동 재생성을 유발하지 않도록 했습니다."
      - 결과물이 저장되는 대로 SSE로 전달했습니다. 결과가 SSE 연결을 맺은 인스턴스와 다른 서버 인스턴스에 도착할 수 있어 데이터베이스를 접점으로 삼았고, 클라이언트가 상태를 조회할 수도 있습니다.
      - 워커의 생성 기능(광고 문구, 브랜드 정보 추출, text-to-image, 레퍼런스 기반 생성, 편집, 크기 조정, A/B 변형 시안)을 구현했습니다. 브랜드 정보를 프롬프트에 주입하고, 이미지 속 문구는 타겟 국가의 언어로 생성하며, 이미지 파일은 객체 스토리지에 저장해 CDN으로 제공하며 이벤트에는 이미지 URL과 메타데이터를 담습니다.
      - LangGraph 대화 흐름에 **크레딧 게이트**를 추가했습니다. 생성 전에 잔여 크레딧을 확인하고, 이미지 결과가 있는 과금 대상 턴·요청마다 한 번 차감하며, 크레딧을 확인할 수 없으면 생성을 차단합니다. 서버와 워커의 인프라·모델·정책 오류 분류도 통일했습니다.
      - 결과물별 모델·생성 설정을 기록하고, 모델이 제공하는 경우 토큰 사용량도 남깁니다. 문구에는 프롬프트 버전을 함께 기록합니다. Langfuse에서 요청 단위와 결과물 단위 관측을 taskId로 연결해, 누락되거나 실패한 결과물을 클라이언트부터 워커까지 추적할 수 있게 했습니다.
      - 외부 캠페인 에이전트용 작업 단위 REST API와 기능별 호출 한도를 개발하고 있습니다. 기존 생성 경로를 재사용하며, 트랜잭션 커밋 후 실행 요청과 행 잠금 기반 한도 예약을 적용합니다.
    stack: [Java & Spring Boot, Python (asyncio), A2A, Kafka, PostgreSQL, LLM]

  - title: 멀티턴 LangGraph 캠페인 에이전트
    kicker: langgraph supervisor · tools · retrieval
    period: 2025 — 2026
    summary: 광고주의 요구사항을 여러 턴의 대화로 수집하고, 캠페인·광고그룹·소재 초안을 만들어 광고주의 확인을 받는 LangGraph supervisor 에이전트입니다(팀 프로젝트). 검색(RAG) 서비스와 검색 도구를 구축해 담당했고, 미리보기와 타겟팅 규칙을 개선했으며, 그에 앞서 프로토타입용 MCP 도구 서버를 만들었습니다.
    flow: [대화·입력 검증, 랜딩페이지 요약, 설정 추출(비동기), 캠페인·광고그룹·소재 미리보기, 광고주 확인]
    highlights:
      - FastAPI와 OpenSearch 벡터 검색으로 **검색(RAG) 서비스**를 처음부터 끝까지 구축했습니다. 설정 저장소에 있는 광고 매뉴얼·FAQ·가이드라인·설정 가이드를 버전·노출 범위 필터와 함께 국가별 인덱스에 적재하고, 문서별 오류 보고와 JWT 인증을 갖춘 적재·검색 API를 제공합니다.
      - 별도로 동작하던 RAG 헬퍼 에이전트를 **supervisor가 필요할 때 호출하는 검색 도구**로 바꾸고, LLM으로 인덱스를 고르던 단계를 국가별 고정 매핑으로 대체했습니다.
      - 설정 추출을 요청 경로에서 분리해 **백그라운드 워크플로우**로 옮기고, 미리보기 단계가 저장된 진행 상태를 기다리도록 했습니다. 추출한 설정은 내부 API로 제공해 문구·이미지 생성 서비스에서도 사용합니다.
      - 캠페인 미리보기는 LLM 호출 대신 추출한 설정값으로 생성하고, 광고그룹 미리보기에는 추출한 연령·성별 타겟팅을 반영했습니다. 국가·계정별 연령 규칙과 허용 캠페인 목표 규칙을 프롬프트에 반영하고, 광고 도메인 지식은 별도 프롬프트 파일로 분리해 테스트를 붙였습니다.
      - 대화당 캠페인 1개 제한, LLM 제공자 장애 시 차단, 크롤링 응답 검증, 크롤링 캐시·타임아웃 설정 등 안정성 장치를 추가하고, 에이전트와 백엔드 서비스의 Sentry 오류 보고 방식을 통일했습니다.
      - 캠페인·광고그룹·광고 조회·생성과 AI 문구·이미지 생성을 프로토타입 에이전트에 제공하는 **FastMCP 도구 서버**를 구축하고, 백오프 재시도와 오류 유형별 매핑을 구현했습니다.
    stack: [Python & LangGraph, FastAPI, RAG, OpenSearch, MCP, LLM]

  - title: 생성형 AI 광고 소재 백엔드
    kicker: genai services
    period: 2024 — 2026
    summary: LINE Ads와 LY Corporation의 여러 광고 상품이 사용하는 광고 문구·이미지 생성 서비스입니다. 아웃페인팅으로 시작한 이미지 생성 서비스를 처음부터 구축했고, 문구 생성·계정·크레딧 기능을 개발했습니다.
    flow: [이미지 요청, Kafka, 모델 호출, 결과 저장, 상태 조회]
    highlights:
      - Python으로 여러 이미지 모델을 먼저 검증한 뒤 **이미지 생성 서비스를 처음부터 구축**했습니다(Java 21, Spring Boot 3). 여러 광고 비율로 이미지를 확장하는 아웃페인팅을 Kafka로 처리하면서, 트랜잭션 커밋 후에만 이벤트를 발행하고 처리 후에 컨슈머 오프셋을 커밋하도록 했습니다. 비율별 결과를 따로 관리해 일부 비율이 실패해도 성공한 결과물을 유지합니다.
      - "**랜딩페이지 브랜드 정보 추출**을 재구축했습니다. 공유 브라우저 풀, 불필요한 요청 차단, 타임아웃을 적용한 헤드리스 브라우저로 페이지를 수집하고, 근거가 없는 항목은 비워 두고 업종은 정해진 목록에서 고르도록 한 LLM 구조화 출력으로 정보를 추출합니다. 크롤링과 LLM 호출의 지연·오류 지표도 추가했습니다."
      - 랜딩페이지 상품 이미지 파이프라인을 구축했습니다. 이미지를 크롤링해 정제한 뒤 객체 스토리지에 병렬로 업로드하고, 외부 이미지 품질 모델로 쓸 수 있는 이미지를 고른 다음 스마트 크롭으로 광고 형식에 맞게 잘라 냅니다.
      - 크롤링 이미지의 크기와 픽셀 수를 제한한 뒤 처리 단계별로 프로파일링했습니다. 업로드한 이미지를 다시 내려받지 않고 재사용하고, 불투명 이미지를 JPEG로 다시 인코딩해 전송 용량을 줄였으며, 다운로드와 업로드에 타임아웃을 적용했습니다.
      - 요청 시간 제한 내에서 여러 샘플을 병렬로 생성하는 모델 기반 **인페인팅**을 구현했습니다. 이미지 생성을 새 SDK와 모델로 이전할 때는 V2 엔드포인트를 따로 두어 기존 V1 클라이언트가 그대로 동작하게 했습니다.
      - "**프롬프트 버전 관리 API**를 구축하고, 광고 문구 생성을 새 상품과 시장(일본·대만·태국)으로 확장했습니다. 텍스트 광고 성과와 AI 문구 사용 여부를 연결한 일 단위 데이터셋을 만들어, AI가 생성한 문구와 일반 문구의 성과를 비교할 수 있게 했습니다."
      - 크레딧 차감 API와 기능별 크레딧 유형을 개발하고, 주간 지급 기간을 일본 표준시(JST) 주 경계에 맞게 고쳤으며, Redis 잠금으로 계정 동시 생성과 중복 지급을 막았습니다. 요청 지표를 추가하고, Sentry 오류를 OpenTelemetry 트레이스와 연결했으며, 새 Kubernetes 테스트 환경을 구성했습니다.
    stack: [Java & Spring Boot, Python & FastAPI, Kafka, Redis, MySQL, LLM]

  - title: 광고 문구 품질 평가·회귀 테스트
    kicker: evaluation · llm-as-a-judge
    period: "2026"
    summary: 대만·태국용 AI 광고 문구를 검증하는 평가 서비스와 회귀 테스트입니다. 현지 언어를 아는 동료에게 의존하던 수동 검토를 줄이려고 만들었으며, 지정한 검증 환경의 배포 후와 모델·프롬프트 변경 검토 시 실행해 규칙 검사와 LLM 평가 결과를 함께 기록합니다.
    flow: [평가 케이스, 문구 생성, 규칙·LLM 평가, 리포트]
    highlights:
      - 필수 문구 누락, 필드별 글자 수, 허용 이모지, 지역별 문자·표현 규칙을 코드로 검사하는 평가 서비스를 FastAPI로 구축했습니다.
      - LLM 평가자가 시장을 식별해 문법·표기를 검사하고 제3자 권리 침해 가능성을 표시하도록 했습니다. 명확성·설득력·창의성·타겟 적합성·세트 일관성은 **5점 척도**로 평가합니다. 평가 결과의 변동을 줄이기 위해 낮은 temperature와 고정 seed를 사용했습니다.
      - 설정 저장소의 선별된 케이스로 생성 API를 병렬 호출하는 Java 회귀 테스트를 구축했습니다. 캠페인 메타데이터를 직접 받는 엔드포인트를 새로 만들어 대화 없이도 같은 테스트 입력을 사용할 수 있게 했고, **통과 여부는 규칙 검사로만 판단**하며 LLM 평가는 검토용으로 기록합니다.
      - "**Argo CD PostSync hook**을 설정한 검증 환경에서 배포 직후 테스트를 자동 실행합니다. GitHub Actions에 Markdown 요약과 JSON 리포트 아티팩트를 남기고, 실패하면 Slack으로 알립니다."
    stack: [Python & FastAPI, Java, LLM-as-a-Judge, GitHub Actions, Argo CD]

  - title: LINE Ads Manager — 캠페인 관리 & 성과 리포트
    kicker: campaign management · reporting pipeline
    period: 2022 — 2025
    summary: 일본·대만·태국에서 사용하는 LINE 광고 플랫폼(DSP)의 광고주용 관리·리포트 영역입니다. 2022–23년에는 캠페인 관리·배치 서비스, 2024–25년에는 리포트 서비스의 주요 백엔드 개발자로 일했습니다.
    flow: [리포트 요청, Kafka, MySQL·Kylin 조회, CSV·GZIP, 객체 스토리지]
    highlights:
      - "**A/B 테스트 캠페인의 백엔드를 공동 개발**했습니다. 소재·타겟팅·입찰 테스트별 제약, 연관 광고의 상태 변경 동기화, 일반 캠페인 전환을 구현했습니다."
      - "**자동 타겟팅**의 검증과 대량 등록 기능을 구현해 지원 국가 전체에 적용했습니다. 관리 화면·대량 등록·외부 API에서 잘못된 설정을 막는 **CBO·입찰·예산 검증**을 추가했습니다."
      - "**태국 PDPA 연령 타겟팅 규칙**을 관리 화면·대량 등록·외부 API·리포트 전반에 적용하고, 기존 광고그룹을 이전하는 API와 Spring Batch 작업을 만들었습니다. 고급 타겟팅을 새 세그먼트 체계로 이전하고, 일본용 신규 오디언스 세그먼트도 추가했습니다."
      - "**Kafka 기반 비동기 리포트 내보내기**(요청 → Kafka → MySQL → CSV/GZIP → 객체 스토리지, 정리 배치 포함)를 구축했습니다. 기존 리포트 파이프라인은 컨슈머를 늘려 처리 지연을 줄이고, poll·스레드 풀 설정을 조정하고, 다계정 리포트를 압축 업로드로 바로 스트리밍하도록 바꿔 안정화했습니다."
      - "**ROAS와 구매 금액 지표**를 Kafka 수집과 리포트 테이블부터 일 단위 집계, 리포트·차트, 외부 API까지 전 구간에 도입했습니다. 이후 클릭·engaged view 기준 지표를 추가하고 집계 오류를 수정했습니다."
      - 게재 위치·앱 번들·캐러셀 슬롯 세부 리포트를 포함한 Kylin 조회를 테이블을 통합한 새 클러스터로 이전했습니다. 도달 리포트 조회에서는 관리 화면 요청을 외부 API보다 우선 처리하고 사용자 유형별 타임아웃을 적용했으며, 요청·성공·실패 지표와 실행 시간 기록을 추가했습니다.
    stack: [Java & Spring Boot, JPA & QueryDSL, MySQL, Kafka, Kylin, Spring Batch]


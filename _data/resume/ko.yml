      value: Java · Python
    - label: 도메인
      value: DSP · 생성형 AI

focus:
  - kicker: agentic pipelines
    title: 멀티턴 캠페인·소재 에이전트
    text: LangGraph 캠페인 에이전트의 RAG·미리보기·정책 검증을 개발했습니다. 소재 에이전트에서는 A2A 서버와 생성 워커를 담당해, 대화 중 이전 결과를 참조한 이미지 수정과 여러 결과물의 상태 관리를 지원합니다.
  - kicker: generative creative
    title: 생성형 AI 광고 소재 서비스
    text: 광고 문구와 이미지 생성·편집을 광고 상품에 연동합니다. 이미지 확장 서비스 구축부터 랜딩페이지 기반 브랜드 정보 추출, 다중 레이아웃 생성, 크레딧 관리까지 개발했습니다.
  - kicker: ad-tech core
    title: 광고 도메인과 성과 리포트
    text: LINE Ads Manager에서 실험 캠페인(Split Test), 자동 타겟팅, 입찰·예산 설정 검증을 개발했습니다. Kafka 기반 비동기 리포트의 동시성 제어와 Kylin 조회 경로를 개선하고 ROAS·전환 가치 지표를 확장했습니다.
  - kicker: evaluation & reliability
    title: 품질 평가와 운영 안정성
    text: 광고 문구 평가에 규칙 검사와 LLM-as-a-Judge를 함께 사용하고, 통합 테스트의 통과 여부와 정성 평가 결과를 구분합니다. 비동기 생성에서는 중복 결과 처리, 부분 실패, 요청 추적으로 운영 문제를 다룹니다.


  summary: |
    **2022년부터 LINE 광고 플랫폼(DSP)**을 개발해 온 백엔드 엔지니어입니다. LINE Ads Manager의 캠페인·광고그룹·광고 관리와 성과 리포트로 시작해, 같은 광고 도메인의 **생성형 AI 소재 서비스와 에이전트 백엔드**로 영역을 넓혔습니다.

    현재는 멀티턴 소재 에이전트의 백엔드인 A2A 서버와 비동기 생성 워커를 직접 만들어 담당하고 있습니다. 검색(RAG), 광고 도메인 규칙, 멱등한 결과 처리, 크레딧 제어, 자동 품질 검사로 LLM 기능이 광고 서비스에서 안정적으로 동작하도록 만듭니다.

projects:
  - title: 멀티턴 광고 소재 에이전트 — A2A 서버·워커
    kicker: a2a · event-driven · genai
    period: 2026.03 — 현재
    ongoing: true
    summary: LangGraph 기반 대화 클라이언트가 요청한 광고 문구·이미지를 생성하는 플랫폼입니다. A2A 서버와 비동기 워커를 주로 담당하며, 외부 캠페인 에이전트용 작업 API로 연동 범위를 확장하고 있습니다.
    flow: [A2A 요청, Pulsar, 생성 워커, 결과 저장, SSE·상태 조회]
    highlights:
      - Java 21·Spring Boot 3로 **A2A(Agent-to-Agent) 서버**를 구축했습니다. JSON-RPC·SSE, Agent Card, PostgreSQL 기반 작업·결과물 저장을 구현하고, 한 요청의 여러 결과물과 후속 요청의 이전 이미지 참조를 지원했습니다.
      - 장시간 이미지 생성을 **Pulsar 기반 비동기 워커로 분리**했습니다. 동시 실행 수를 제한하고, 중복 결과를 멱등하게 저장하며, 결과물별 성공·실패를 기록해 일부 생성 실패 시에도 성공한 결과를 유지합니다.
      - OpenAI·Gemini 기반 이미지 생성, 레퍼런스 활용, 편집, 크기 조정, A/B 비교용 시안 생성 기능을 구현했습니다. 브랜드 정보를 프롬프트에 주입하고 타겟 국가에 맞는 이미지 내 문구 언어를 지정합니다.
      - LangGraph 대화 흐름에 **크레딧을 확인할 수 없으면 생성을 차단하는 검증**을 추가하고, 서버·워커 간 인프라·모델·정책 오류 분류를 정리했습니다.
      - 외부 캠페인 에이전트용 **작업 단위 REST API와 기능별 호출 한도**를 구현했습니다. 기존 생성 경로를 재사용하며, 트랜잭션 커밋 후 실행 요청과 행 잠금 기반 한도 예약을 적용했습니다. 연동 개발은 진행 중입니다.
      - 생성 모델·설정·프롬프트 버전과 제공되는 토큰 사용량을 결과물에 기록하고, Langfuse에서 요청·결과물 단위로 추적해 품질·지연 문제를 조사할 수 있게 했습니다.
    stack: [LangGraph, A2A, Java 21, Spring Boot 3, Python, FastAPI, Apache Pulsar, PostgreSQL, OpenAI, Gemini, Langfuse, OpenTelemetry]

  - title: 멀티턴 LangGraph 캠페인 에이전트
    kicker: langgraph supervisor · tools · retrieval
    period: 2025 — 2026
    summary: 대화에서 광고주의 요구를 수집해 캠페인·광고그룹 초안을 제시하는 팀 프로젝트입니다. RAG 검색, 미리보기 생성, 도메인 정책 검증에 기여하고 광고·소재 API를 제공하는 MCP 서버를 구축했습니다.
    flow: [대화, 설정 정보 추출, 정책 검증, 캠페인·광고그룹 미리보기]
    highlights:
      - 광고 매뉴얼·FAQ를 청킹·임베딩하고 OpenSearch로 검색하는 **RAG 파이프라인**을 구축했습니다. 질문에 맞는 문서 인덱스를 선택하는 라우터와 검색 결과를 활용하는 헬퍼를 개발했습니다.
      - 별도 헬퍼 에이전트를 **supervisor가 필요할 때 호출하는 도구**로 변경하고, 대화 요약·설정 정보 추출을 비동기 워크플로우로 분리했습니다.
      - "**캠페인 미리보기에서 LLM 호출을 제거**하고 추출한 메타데이터로 설정값을 생성했습니다. 광고그룹의 연령·성별 타겟팅도 추출 결과를 명시적으로 반영하도록 개선했습니다."
      - 국가·계정 정책에 따른 연령 검증과 허용 캠페인 목표 검사를 보완했습니다. 도메인 규칙과 Jinja2 프롬프트 템플릿을 분리해 관리했습니다.
      - "**FastMCP 도구 서버**로 캠페인·광고그룹·광고 조회·생성, 소재 생성, 랜딩페이지 분석 기능을 노출하고 재시도·오류 처리를 구현했습니다."
    stack: [LangGraph, LangChain, MCP, RAG, OpenSearch, FastAPI, MongoDB, OpenAI]

  - title: GenAI 광고 소재 백엔드
    kicker: genai services
    period: 2024 — 2026
    summary: LINE Ads와 LY Corporation 광고 상품에서 사용하는 문구·이미지 생성 백엔드입니다. 이미지 확장 서비스를 처음부터 구축하고, 문구 생성·프롬프트 운영·크레딧 기능을 확장했습니다.
    flow: [이미지 요청, Kafka, 모델 호출, 결과 저장, 상태 조회]
    highlights:
      - "**다양한 광고 비율로 이미지를 확장하는 아웃페인팅 서비스**를 Java 21·Spring Boot 3와 Vertex AI로 구축했습니다. Kafka 비동기 처리, 트랜잭션 커밋 후 이벤트 발행, 비율별 결과·요청 상태 관리를 구현했습니다."
      - "**랜딩페이지 기반 브랜드 정보 추출**을 개발하고, 근거가 없는 정보는 빈 값으로 반환하며 업종은 허용 목록과 일치할 때만 채택하도록 개선했습니다."
      - 여러 레이아웃의 병렬 이미지 생성과 Gemini 기반 인페인팅을 구현하고, 외부 이미지 품질 판정·스마트 크롭 기능을 연동했습니다.
      - 크롤링 이미지 처리의 단계별 지연을 계측하고, 이미지 크기 제한·불필요한 재다운로드 제거·업로드 타임아웃을 적용했습니다.
      - 광고 문구 생성 기능과 **프롬프트 버전 관리 API**를 확장했습니다. AI 문구와 일반 문구의 성과를 비교할 수 있는 Airflow·Hive 일 배치 테이블도 구축했습니다.
      - 크레딧 차감·주간 지급·기능별 유형을 개발하고 계정 생성·지급의 동시 요청을 잠금으로 제어했습니다. 요청 메트릭, OpenTelemetry·Sentry 추적, Kubernetes 배포 설정을 정비했습니다.
    stack: [Java 21, Spring Boot 3, Kafka, Redis, MySQL, Python, FastAPI, OpenAI, Gemini, Vertex AI, Airflow, Hive, Kubernetes]

  - title: 광고 문구 품질 평가·회귀 테스트
    kicker: evaluation · llm-as-a-judge
    period: "2026"
    summary: 대만·태국용 AI 광고 문구의 모델·프롬프트 변경을 검토하기 위한 평가 서비스와 통합 테스트입니다. 규칙 검사와 LLM의 정성 평가를 함께 기록합니다.
    flow: [평가 케이스, 문구 생성, 규칙·LLM 평가, 리포트]
    highlights:
      - "**필수 문구 누락, 필드별 글자 수, 허용 이모지, 지역별 문자·표현 규칙**을 코드로 검사하는 평가 서비스를 구축했습니다."
      - LLM이 문법·표기와 제3자 권리 관련 문제를 검토하고, 명확성·설득력·창의성·타겟 적합성·세트 일관성을 **5점 척도**로 평가하도록 구성했습니다.
      - 설정 저장소의 평가 케이스로 생성 API를 병렬 호출하는 통합 테스트를 구현했습니다. **테스트 통과 여부는 규칙 검사로 판단**하고 LLM 평가 결과는 검토용 리포트에 남깁니다.
      - Markdown·JSON 리포트와 CI 요약을 제공해 국가별 모델·프롬프트 변경 전후를 비교할 수 있게 했습니다.
    stack: [LLM-as-a-Judge, Python, FastAPI, OpenAI, Java 21, JUnit 5, GitHub Actions, Docker]

  - title: LINE Ads Manager — DSP 코어 & 리포트
    kicker: dsp core · data pipeline
    period: 2022 — 2025
    summary: 일본·대만·태국의 LINE Ads 광고 관리 백엔드에서 캠페인 설정과 성과 리포트를 개발·운영했습니다. 실험 캠페인, 설정 검증, 비동기 리포트의 안정성 개선을 담당했습니다.
    flow: [리포트 요청, Kafka, MySQL·Kylin 조회, CSV·GZIP, 객체 스토리지]
    highlights:
      - 소재·타겟팅·입찰 전략을 비교하는 **Split Test 캠페인 구조를 공동 개발**했습니다. 실험 목적별 구조 제약, 연관 광고 상태 동기화, 일반 캠페인 전환을 구현했습니다.
      - 자동 타겟팅과 **CBO·입찰·예산 조합 검증**을 보완하고, 관리 화면·대량 등록·외부 API에서 잘못된 설정을 차단하도록 적용했습니다.
      - 기존 **Kafka 기반 비동기 리포트를 확장·안정화**했습니다. 컨슈머·작업 실행 동시성을 조정하고, 다계정 CSV 생성과 압축·업로드 경로를 개선했습니다.
      - "**광고비 대비 매출(ROAS)·전환 가치** 지표와 캐러셀 슬롯·앱 번들별 세부 리포트를 확장하고 관련 집계·계산 오류를 수정했습니다."
      - 사용자 유형별 쿼리 우선순위·타임아웃을 도입하고 Kylin 조회 경로를 새 클러스터로 전환했습니다. 요청·성공·실패 지표와 실행 이력으로 운영 상태를 추적했습니다.
    stack: [Java, Spring Boot, JPA, QueryDSL, MyBatis, MySQL, Kafka, Kylin, Druid, Spring Batch, Prometheus]


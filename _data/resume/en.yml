projects:
  - title: Multi-turn Creative Agent — A2A Server & Workers
    kicker: a2a · event-driven · genai
    period: 2026.03 — present
    ongoing: true
    summary: An agent platform that generates ad copy and images for a LangGraph conversational client over A2A, with Kafka-based asynchronous workers. I built the A2A server and generation workers, including task management, result persistence and automated tests.
    flow: [A2A request, Kafka request topic, generation workers, Kafka result topic, result storage, SSE · polling]
    highlights:
      - Built the **A2A (Agent-to-Agent) server** on Java 21 and Spring Boot 3, with JSON-RPC, SSE streaming, an Agent Card and PostgreSQL task and artifact storage. Supported up to four outputs per request and follow-up requests that build on an earlier image.
      - Moved long-running generation from synchronous calls to **Kafka-based asynchronous workers**, running the new path in shadow mode before cutting over. Recorded requested outputs before dispatch and tracked completion or failure separately, preserving successful outputs when others fail.
      - "Designed for **at-least-once delivery**: bounded retries with a dead-letter queue (DLQ), **taskId as the message key** to route a task's events to the same partition within each topic, and idempotent persistence through a (taskId, artifactId) unique key and conditional task-state updates. Ordering is scoped to a partition; retries and duplicate deliveries are handled through these state checks. Model failures are recorded as failed results without triggering automatic regeneration."
      - Streamed outputs over SSE as they were stored, using persisted task state to coordinate server instances because results can reach a different server instance from the one holding the connection; clients can also retrieve status by polling.
      - "Implemented the worker's generation features: ad copy, brand extraction, text-to-image, reference-based generation, editing, resizing and A/B variations. Brand information is injected into prompts, in-image copy follows the target market's language, and image bytes are stored in object storage and served through a CDN; events carry image URLs and metadata."
      - "Added a **credit gate** to the LangGraph conversation flow: check credit before generation and deduct once per eligible turn or request with image results. Blocked generation when credit could not be verified, and aligned infrastructure, model and policy error categories across the server and workers."
      - Recorded output-level model and generation settings, token usage when reported by the model, and prompt versions for copy. Added per-request and per-output Langfuse observations joined by taskId to trace missing or failed outputs from the client to the worker.
      - Now building job-based REST APIs and per-feature quotas for an external campaign agent, reusing the generation path with dispatch after transaction commit and row-locked quota reservation.
    stack: [Java & Spring Boot, Python (asyncio), A2A, Kafka, PostgreSQL, LLM]

  - title: Multi-turn LangGraph Campaign Agent
    kicker: langgraph supervisor · tools · retrieval
    period: 2025 — 2026
    summary: A team-built LangGraph supervisor agent that gathers an advertiser's requirements over several turns and drafts the campaign, ad group and creatives for the advertiser to confirm. I built and owned the retrieval (RAG) service and its search tool, improved previews and targeting rules, and earlier built an MCP tool server for the prototype.
    flow: [conversation · validation, landing-page summary, settings extraction (async), campaign · ad group · creative preview, advertiser confirmation]
    highlights:
      - Built the **retrieval service** end to end with FastAPI and OpenSearch vector search. It loads ad manuals, FAQs, guidelines and setup guides from a configuration repository into per-country indices with version and visibility filters, and exposes ingest and search APIs with per-document error reporting and JWT authentication.
      - Turned a separate RAG helper agent into a **search tool the supervisor calls when needed**, and replaced an LLM index-routing call with deterministic, country-based index selection.
      - Moved settings extraction off the request path into a **background workflow** with persisted status that the preview step waits on, and exposed the extracted settings through an internal API used by the copy and image services.
      - Built campaign previews directly from extracted settings instead of an LLM call, and applied extracted age and gender targeting to ad group previews. Encoded country- and account-level age rules and objective-availability rules in the agent's prompts, and split ad-domain knowledge into standalone prompt files with tests.
      - Added reliability guards — one campaign per conversation, a gate for LLM-provider outages, crawl-response validation and configurable crawl caching and timeouts — and standardized Sentry error reporting across the agent and backend services.
      - Built a **FastMCP tool server** that exposed campaign, ad group and ad read/create operations and AI copy and image generation to the prototype's agents, with backoff retries for HTTP calls and error mapping by type.
    stack: [Python & LangGraph, FastAPI, RAG, OpenSearch, MCP, LLM]

  - title: Generative AI Ad Creative Backend
    kicker: genai services
    period: 2024 — 2026
    summary: Copy and image generation services behind LINE Ads and other LY Corporation ad products. I built the image generation service from scratch, starting with outpainting, and developed copy-generation, account and credit features.
    flow: [image request, Kafka, model call, result storage, status polling]
    highlights:
      - "**Built the image generation service from scratch** (Java 21, Spring Boot 3) after prototyping several image models in Python. Implemented Kafka-based outpainting for multiple ad aspect ratios, publishing only after the transaction commits and committing consumer offsets after processing, with per-ratio results to preserve successful outputs when other ratios fail."
      - "Rebuilt **landing-page brand extraction**: headless-browser crawling with a shared browser pool, request blocking and timeouts, followed by LLM structured output that leaves unsupported fields empty and picks the industry from a fixed list. Added latency and error metrics for crawling and LLM calls."
      - Built the landing-page product-image pipeline, which crawls images, sanitizes them, re-hosts them in object storage with parallel uploads, and filters and crops them for ad formats using an external image-quality model and smart cropping.
      - Capped crawled-image size and pixel count, then profiled each processing stage. Reused uploaded bytes instead of downloading them again, re-encoded opaque images as JPEG to reduce transfer size and bounded downloads and uploads with timeouts.
      - Implemented model-based **inpainting** that generates samples in parallel under a request deadline. Migrated image generation to a newer SDK and model behind V2 endpoints, so V1 clients kept working.
      - Built the **prompt-version management API** and extended copy generation to new products and markets (Japan, Taiwan and Thailand). Built a daily dataset that links text-ad performance to AI-copy usage, so AI-generated and other copy can be compared.
      - Built the credit consumption API and per-feature credit types, fixed weekly grant periods at JST week boundaries, and added Redis locks against concurrent account creation and duplicate grants. Added request metrics, linked Sentry errors to OpenTelemetry traces and set up a new Kubernetes test environment.
    stack: [Java & Spring Boot, Python & FastAPI, Kafka, Redis, MySQL, LLM]

  - title: Ad Copy Quality Evaluation & Regression Testing
    kicker: evaluation · llm-as-a-judge
    period: "2026"
    summary: An evaluation service and regression suite for AI-generated ad copy in Taiwan and Thailand, built to reduce manual review that relied on colleagues fluent in those languages. It runs after deployments to configured test environments and on demand for model or prompt changes, recording both rule checks and LLM assessments.
    flow: [evaluation cases, copy generation, rules · LLM assessment, report]
    highlights:
      - Built the evaluation service in FastAPI, with code-based checks for missing required text, per-field character limits, allowed emoji and regional character and expression rules.
      - Configured an LLM judge to identify the market, check grammar and writing conventions, flag potential third-party rights issues, and score clarity, persuasiveness, creativity, target relevance and set coherence on a **five-point scale**, using a low temperature and a fixed seed to reduce evaluation variability.
      - Built a Java regression suite that calls the generation API in parallel with curated cases from a configuration repository, through a new endpoint that takes campaign metadata directly so test inputs can be replayed without a conversation. **Pass/fail depends only on rule checks**; LLM assessments are recorded for review.
      - Ran the suite automatically after deployments to configured test environments through an **Argo CD PostSync hook**, publishing Markdown summaries and JSON report artifacts in GitHub Actions and sending Slack alerts on failure.
    stack: [Python & FastAPI, Java, LLM-as-a-Judge, GitHub Actions, Argo CD]

  - title: LINE Ads Manager — Campaign Management & Reporting
    kicker: campaign management · reporting pipeline
    period: 2022 — 2025
    summary: The advertiser-facing management and reporting layer of LINE's DSP, used in Japan, Taiwan and Thailand. I was one of the main backend developers of the campaign-management and batch services in 2022–23 and of the reporting service in 2024–25.
    flow: [report request, Kafka, MySQL · Kylin queries, CSV · GZIP, object storage]
    highlights:
      - "**Co-developed A/B test campaigns**, implementing experiment-specific constraints for creative, targeting and bidding tests, synchronized status changes across related ads, and conversion to regular campaigns."
      - Built validation, bulk-upload support and rollout across supported markets for **automatic targeting**, and added **CBO, bid and budget validation** that rejects invalid settings in the console, bulk upload and external API.
      - Implemented **Thailand's PDPA age-targeting rules** across the console, bulk upload, external API and reports, with an API and a Spring Batch job to migrate existing ad groups. Also migrated advanced targeting to a new segment schema and added new audience segments for Japan.
      - Built a **Kafka-based asynchronous report export** (request → Kafka → MySQL → CSV/GZIP → object storage, with a cleanup job). Stabilized the existing report pipeline by adding concurrent consumers to reduce lag, tuning poll and thread-pool settings and streaming multi-account reports straight into compressed uploads.
      - Introduced **ROAS and purchase-value metrics** end to end, from Kafka ingestion and report tables to daily rollups, reports, charts and the external API, then added click and engaged-view variants and fixed aggregation errors.
      - Migrated Kylin report queries, including placement, app-bundle and carousel-slot breakdowns, to a new cluster with merged tables. Prioritized console over external-API reach-report queries with per-user-type timeouts, and added request, success and failure metrics and execution-time records.
    stack: [Java & Spring Boot, JPA & QueryDSL, MySQL, Kafka, Kylin, Spring Batch]


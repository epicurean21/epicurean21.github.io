projects:
  - title: Multi-turn Creative Agent — A2A Server & Workers
    kicker: a2a · event-driven · genai
    period: 2026.03 — present
    ongoing: true
    summary: An event-driven platform that uses Kafka to generate ad copy and images for a LangGraph conversational client. I primarily own the A2A server and asynchronous workers, and am extending the platform with job APIs for an external campaign agent.
    flow: [A2A request, Kafka request topic, generation workers, Kafka result topic, result storage, SSE · polling]
    highlights:
      - Built the **A2A (Agent-to-Agent) server** with Java 21 and Spring Boot 3, including JSON-RPC, SSE, an Agent Card and PostgreSQL task/artifact storage. Supported multiple outputs per request and references to earlier images in follow-up requests.
      - Moved long-running image generation to **Kafka-based asynchronous workers**, with separate request and result topics. Bounded in-flight work and tracked per-artifact outcomes so partial failures retain successful outputs.
      - Designed for **Kafka's at-least-once consumption model**, with bounded retries and a dead-letter queue (DLQ). Used **(taskId, artifactId) uniqueness and conditional task-state updates** to make result persistence and finalization idempotent under redelivery.
      - Used **taskId as the partition key** to route each task's events to the same partition within a topic and consume results in partition order.
      - Integrated generative models for image generation, reference-based generation, editing, resizing and variations for A/B comparison. Injected brand information into prompts and specified the language of in-image copy for each target market.
      - Added a **credit check that blocks generation when credit cannot be verified** to the LangGraph conversation flow, and aligned infrastructure, model and policy error categories between the server and workers.
      - Implemented **job-based REST APIs and per-feature quotas** for an external campaign agent. Reused the existing generation path with dispatch after transaction commit and row locks for quota reservation. Integration work is ongoing.
      - Recorded models, settings, prompt versions and available token usage on generated artifacts. Added request- and artifact-level Langfuse tracing to investigate quality and latency issues.
    stack: [Java & Spring Boot, Python & LangGraph, A2A, Kafka, PostgreSQL, LLM]

  - title: Multi-turn LangGraph Campaign Agent
    kicker: langgraph supervisor · tools · retrieval
    period: 2025 — 2026
    summary: A team project that gathers advertiser requirements through conversation and presents campaign and ad group drafts. I contributed retrieval, previews and domain-policy validation, and built an MCP server exposing ad management and creative APIs.
    flow: [conversation, extract settings, policy validation, campaign · ad group preview]
    highlights:
      - Built a **RAG pipeline** that chunks and embeds ad manuals and FAQs for OpenSearch retrieval, with an index router and a helper that uses the retrieved documents.
      - Replaced a separate helper agent with a **tool the supervisor invokes when needed**, and moved conversation summarization and settings extraction into an asynchronous workflow.
      - "**Removed the LLM call from campaign preview generation**, building settings directly from extracted metadata. Also made ad group previews explicitly use the extracted age and gender targeting values."
      - Improved age validation for country and account policies and checks for allowed campaign objectives. Managed domain rules separately from Jinja2 prompt templates.
      - Built a **FastMCP tool server** exposing campaign, ad group and ad retrieval/creation, creative generation and landing-page analysis, with retry and error handling.
    stack: [Python & LangGraph, MCP, RAG, OpenSearch, LLM]

  - title: Generative AI Ad Creative Backend
    kicker: genai services
    period: 2024 — 2026
    summary: A copy and image generation backend for LINE Ads and other LY Corporation ad products. I built the image outpainting service from scratch and extended copy generation, prompt management and credit features.
    flow: [image request, Kafka, model call, result storage, status polling]
    highlights:
      - Built an **outpainting service for multiple ad aspect ratios**, integrating image generation models with Java 21 and Spring Boot 3. Implemented asynchronous Kafka processing, event publication after transaction commit, and per-ratio result and request-status tracking.
      - Developed **landing-page brand extraction**, returning empty values for unsupported facts and accepting industry classifications only when they match an allowed list.
      - Implemented parallel multi-layout generation and model-based inpainting, and integrated external image quality assessment and smart cropping.
      - Profiled each stage of crawled-image processing, then added image-size limits, removed redundant downloads and applied upload timeouts.
      - Extended ad copy generation and **prompt version management APIs**. Built daily batch datasets for comparing the performance of AI-generated and other ad copy.
      - Developed credit consumption, weekly grants and per-feature credit types, with locks for concurrent account creation and grants. Improved request metrics, OpenTelemetry/Sentry tracing and Kubernetes deployment configuration.
    stack: [Java & Spring Boot, Python & FastAPI, Kafka, Redis, MySQL, LLM]

  - title: Ad Copy Quality Evaluation & Regression Testing
    kicker: evaluation · llm-as-a-judge
    period: "2026"
    summary: An evaluation service and integration tests for reviewing model and prompt changes to AI-generated ad copy for Taiwan and Thailand. Records both rule checks and qualitative LLM assessments.
    flow: [evaluation cases, copy generation, rules · LLM assessment, report]
    highlights:
      - Built code-based checks for **missing required text, per-field character limits, allowed emoji and regional character/expression rules**.
      - Configured an LLM to assess grammar, writing conventions and potential third-party rights issues, and to score clarity, persuasiveness, creativity, target relevance and set coherence on a **five-point scale**.
      - Built integration tests that call the generation API in parallel using cases from a configuration repository. **Test pass/fail is based on rule checks**; LLM assessments are recorded for review.
      - Produced Markdown/JSON reports and CI summaries to compare model and prompt changes by market.
    stack: [Python & FastAPI, Java, LLM, LLM-as-a-Judge, GitHub Actions]

  - title: LINE Ads Manager — DSP Core & Reporting
    kicker: dsp core · data pipeline
    period: 2022 — 2025
    summary: Developed and operated campaign management and performance reporting for LINE Ads in Japan, Taiwan and Thailand. My work covered experiment campaigns, configuration validation and asynchronous reporting reliability.
    flow: [report request, Kafka, MySQL · Kylin queries, CSV · GZIP, object storage]
    highlights:
      - "**Co-developed Split Test campaign structures** for comparing creatives, targeting and bid strategies. Implemented experiment-specific constraints, related ad-status synchronization and conversion to regular campaigns."
      - Improved automatic targeting and **CBO, bid and budget validation**, rejecting invalid settings across the management console, bulk upload and external APIs.
      - Extended and stabilized the existing **Kafka-based asynchronous reporting pipeline**. Tuned consumer and job concurrency, and improved multi-account CSV generation, compression and upload paths.
      - Extended **return on ad spend (ROAS) and conversion-value** metrics and breakdowns by carousel slot and app bundle, fixing related aggregation and calculation errors.
      - Introduced query priorities and timeouts by user type and migrated Kylin queries to a new cluster. Tracked operations through request, success and failure metrics and execution records.
    stack: [Java & Spring Boot, JPA & QueryDSL, MySQL, Kafka, Kylin]

